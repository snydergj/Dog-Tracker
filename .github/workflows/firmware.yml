name: Build tracker firmware

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Test GPS display readings
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/TrackerOTA \
            firmware/TrackerOTA/GpsStatus.cpp tests/gps-status.cpp -o "$RUNNER_TEMP/test-gps-status"
          "$RUNNER_TEMP/test-gps-status"
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Install ESP32 board support
        env:
          ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls "$ESP32_INDEX"
      - name: Install display libraries
        run: |
          arduino-cli lib install --no-deps 'Adafruit BusIO@1.17.4' 'Adafruit GFX Library@1.12.4' 'Adafruit ST7735 and ST7789 Library@1.11.0'
      - name: Read firmware version
        id: version
        run: |
          version=$(sed -nE 's/^#define TRACKER_VERSION "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' firmware/TrackerOTA/Version.h)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build firmware
        run: |
          node firmware/embed-dashboard.mjs
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=8M,PartitionScheme=default_8MB \
            --output-dir "$RUNNER_TEMP/tracker" firmware/TrackerOTA
          mkdir firmware-artifacts
          cp "$RUNNER_TEMP/tracker/TrackerOTA.ino.bin" firmware-artifacts/heltec-wireless-tracker-v2-ota.bin
          cp "$RUNNER_TEMP/tracker/TrackerOTA.ino.merged.bin" firmware-artifacts/heltec-wireless-tracker-v2-usb.bin
      - uses: actions/upload-artifact@v4
        with:
          name: heltec-wireless-tracker-v2
          path: firmware-artifacts/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && github.event.head_commit.message == format('Release firmware v{0}', needs.build.outputs.version)))
    runs-on: ubuntu-24.04
    concurrency:
      group: firmware-release-${{ needs.build.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: heltec-wireless-tracker-v2
      - name: Publish the verified build as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          FIRMWARE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$FIRMWARE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag_args=(--verify-tag)
          else
            tag_args=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" "${tag_args[@]}" \
            --title "Dog Tracker $tag" --generate-notes --latest \
            heltec-wireless-tracker-v2-ota.bin heltec-wireless-tracker-v2-usb.bin
